<div class="row">
  <div class="header-title col-10">
    <a class="site-title" href="{{ relative_url }}/">{{ site.title }}</a>
  </div>
  <div class="header-icons col-2">
    <!-- Mobile menu toggle button (hamburger/x icon) -->
    <input id="main-menu-state" type="checkbox" />
    <label class="main-menu-btn" for="main-menu-state">
      <span class="main-menu-btn-icon"></span>
      <span class="menu-hint-visually-hidden">Toggle main menu visibility</span>
    </label>

    <button id="mapToggle" class="btn btn-link p-0" aria-label="Open map">
      <img src="{{'/icons/map.svg' | relative_url }}" class="icon" alt="pattern map" title="Use the pattern map to jump to another pattern." />
    </button>

    <a href="{{'pattern-index.html' | relative_url }}" ><img src="{{ '/icons/list-ul.svg' | relative_url }}" class="icon" title="An alphabetical index of all patterns." alt="pattern index" /></a>
  </div>
</div>
