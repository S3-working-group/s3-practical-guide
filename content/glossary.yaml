# this is the database for the glossary.
# each entry has a key that is used to reference it in the source files 
# {{define:driver}}
# and some translatable strings
# - name: the name of the glossary entry
# - definition: the definition of the term in the form "a **x** is …"
# - glossary: glossary text for a term
# - note: a note that will be added as a second paragraph to the glossary after the definition

title: Glossary
continued: (…)
terms:
  acceptance-criteria:
    name: Acceptance Criteria
    definition: "**Acceptance Criteria** are a number of specific, verifiable properties of the conditions and/or outcomes of a requirement that, when taken together, indicate the requirement is considered fulfilled."
    glossary: A number of specific, verifiable properties of the conditions and/or outcomes of a requirement that, when taken together, indicate the requirement is considered fulfilled.
  accountability:
    name: Accountability (principle)
    definition:
    glossary: "**Respond when something is needed, do what you agreed to do, and accept your share of responsibility for the course of the organization,** so that what needs doing gets done, nothing is overlooked, and everyone does what they can to contribute toward the effectiveness and integrity of the organization."
  account:
    name: Attend to (v.)
    glossary: to take responsibility for something.
  alignment:
    name: Alignment
    glossary: The process of aligning the actions of all parts of an organization with the organization's objectives.
  backlog:
    name: Backlog
    definition: A **backlog** (to-do list) is a list of (often prioritized) uncompleted work items (typically a deliverable, requirement, or driver) that need to be addressed.
    glossary: A list of (often prioritized) uncompleted work items (typically a deliverable, requirement or a driver) that need to be addressed.
  chosen-values:
    name: Chosen Values
    glossary: A set of principles that a team (or an organization) has chosen to collectively adopt to guide their behavior in the context of their collaboration.
  circle:
    name: Circle
    definition: A **circle** is a self-governing and semi-autonomous team of equivalent people who collaborate to attend to a domain.
    glossary: A self-governing and semi-autonomous team of equivalent people who collaborate to attend to a domain.
  check-in:
    name: Check-In
    definition: 
    glossary: A brief disclosure where you share something about what's up for you and how you are, revealing thoughts, feelings, distractions, or needs. 
  complexity:
    name: Complexity
    glossary: An environment where unknowns are unknown, cause and effect can only be understood in retrospect, and actions lead to unpredictable changes. [Snowden and Boone]
  concern:
    name: Concern
    definition: A **concern** is an assumption that cannot (for now at least) be backed up by reasoning or enough evidence to qualify as an objection to those who are considering it.
    glossary: An assumption that cannot (for now at least) be backed up by reasoning or enough evidence to qualify as an objection to those who are considering it.
  consent:
    name: Consent (principle)
    definition:
    glossary: "**Raise, seek out and resolve objections to proposals, policies and activities**, to reduce the potential for decisions leading to undesirable consequences and to discover worthwhile ways to improve."
  constituent:
    name: Constituent
    definition:
    glossary: A group (e.g., a circle, team, department, branch, project, or organization) that delegates authority to a representative to act on their behalf in other teams or organizations.
  constraint:
    name: Constraint
    definition: A constraint is a limitation or restriction that controls or limits what someone can do or what can happen. It can be a requirement to fulfill, a rule to follow, or a boundary on actions, behaviors, or outcomes.
    glossary: A limitation or restriction that controls or limits what someone can do or what can happen. It can be a requirement to fulfill, a rule to follow, or a boundary on actions, behaviors, or outcomes.
  continuous-improvement: 
    name: Continuous Improvement (principle)
    definition:
    glossary: "**Regularly review the outcomes of your actions, then make incremental improvements to what you do and how you do it based on what you learn**, so that you can adapt to changes when necessary, and maintain or improve effectiveness over time."
  coordination:
    name: Coordination
    definition:
    glossary: The process of enabling individuals or teams to collaborate effectively across different domains to achieve shared objectives.
  current-conditions:
    name: Current conditions
    definition: In the context of organizational drivers, **current conditions** are present, observable circumstances that are causing — or could plausibly cause — effects relevant to the organization's purpose.}}
    glossary: (In the context of organizational drivers) Current conditions are present, observable circumstances that are causing — or could plausibly cause — effects relevant to the organization's purpose.}}
  delegatee:
    name: Delegatee
    glossary: An individual or group accepting responsibility for a domain delegated to them, becoming a role keeper or a team.
  delegation:
    name: Delegation
    definition: "**Delegation is the grant of authority by one party (the delegator) to another (the delegatee) to attend to a domain (i.e., to do certain things or to make certain decisions), for which the delegator maintains overall accountability.**"
    glossary: The grant of authority by one party (the delegator) to another (the delegatee) to attend to a domain (i.e. to do certain things or to make certain decisions), for which the delegator maintains overall accountability.
  delegator:
    name: Delegator
    glossary: An individual or group delegating responsibility for a domain to other(s).
  deliverable:
    name: Deliverable
    definition: A **deliverable** is a product or service provided in the context of an intervention. Products include components and materials.
    glossary: A product or service provided provided in the context of an intervention. Products include components and materials.
  domain:
    name: Domain
    definition: A **domain** is a distinct area of responsibility and authority within an organization.
    glossary: A distinct area of responsibility and authority within an organization.
  driver:
    name: Driver
    definition: A **driver** is a person's or a group's motive for responding to a specific situation.
    glossary: A person's or a group's motive for responding to a specific situation.
  effectiveness:
    name: Effectiveness (principle)
    definition:
    glossary: "**Devote time only to what brings you closer towards achieving your organization's overall objectives**, so that you can make the best use of your limited time, energy, and resources."
  empiricism:
    name: Empiricism (principle)
    definition:
    glossary: "**Test all assumptions you rely on through experiments and continuous revision**, so that you learn fast, make sense of things, and navigate complexity as effectively as you can."
  enabling-conditions:
    name: Enabling Conditions
    definition: In the context of a requirement, **enabling conditions** are conditions considered necessary to establish for achieving or maintaining intended outcomes.
    glossary: Conditions considered necessary to establish for achieving or maintaining intended outcomes (in the context of a requirement).
  equivalence:
    name: Equivalence (principle)
    definition:
    glossary: "**Involve people in making and evolving decisions that affect them**, to increase engagement and accountability, and utilize the distributed intelligence to achieve and evolve your objectives."
  evolve:
    name: Evolve (v.)
    glossary: to develop gradually.
  flow-of-value:
    name: Flow of Value
    glossary: Deliverables traveling through an organization towards customers or other stakeholders.
  governance:
    name: Governance
    definition: "**Governance** the sum of activities involved in setting significant objectives and making and evolving significant decisions (policies) that guide people toward achieving those objectives, for the entire organization or specific people within it."
    glossary: The sum of activities involved in setting objectives and making and evolving decisions (policies) that guide people toward achieving those objectives, for the entire organization or specific people within it.
  governance-backlog:
    name: Governance Backlog
    definition: A **governance backlog** is a visible, prioritized list of items relating to the governance of a domain.
    glossary: A visible, prioritized list of items relating to the governance of a domain.
  intended-outcome:
    name: Intended Outcome
    definition: In the context of a requirement, **intended outcome(s)** are specific, observable results you aim to achieve in relation to a driver.
    glossary:  Specific, observable results you aim to achieve in relation to a driver.
  intervention: 
    name: Intervention
    definition: An intervention is the specific steps you take and/or the constraints you put in place to fulfill a purpose.
    glossary: The specific steps you take and/or the constraints you put in place to fulfill a purpose.
  helping-team:
    name: Helping Team
    definition: 
    glossary: A team of equivalent people with the mandate to execute on a specific set of requirements.
  key-responsibilities:
    name: Key Responsibilities
    glossary: The work and decision-making considered essential in achieving a domain’s purpose.
  logbook:
    name: Logbook
    definition:
    glossary: A (digital) system to store all information relevant to running an organization. 
  metric:
    name: Metric
    definition: A **metric** is a quantifiable measure used to track and assess progress, evaluate outcomes and determine success.
    glossary: A quantifiable measure used to track and assess progress, evaluate outcomes, and determine success.
  objection:
    name: Objection
    definition: An **objection** is an argument – relating to a proposal, existing decision, or activity being conducted by one or more members of the organization – that reveals consequences or risks that are preferably avoided for the organization or that demonstrates worthwhile ways to improve.
    glossary: An argument – relating to a proposal, existing decision, or activity being conducted by one or more members of the organization – that reveals consequences or risks that are preferably avoided for the organization or that demonstrates worthwhile ways to improve.
  objective:  
    name: Objective
    definition: An **objective** is a specific result (or goal) that a person, team, or organization wants to achieve.
    glossary: A specific result (or goal) that a person, team, or organization wants to achieve. In the context of S3, objectives refer to achieving intended outcomes, establishing desired conditions, and responding adequately to organizational drivers, all with the overarching aim of fulfilling the organization’s purpose.
  open-team:
    name: Open Team
    definition: An **open team** is a group of people who are invited to contribute to the work and governance done in a domain when they can.
    glossary: A group of people who are invited to contribute to the work and governance done in a domain when they can.
  operations:
    name: Operations
    definition: "**Operations** is doing the work and organizing day-to-day activities within the constraints defined through governance."
    glossary: Doing the work and organizing day-to-day activities within the constraints defined through governance. 
  operations-backlog:
    name: Operations Backlog
    definition: An **operations backlog** is a visible list of (typically prioritized) uncompleted work items (deliverables).
    glossary: A visible list of (typically prioritized) uncompleted work items (deliverables).
  organization:
    name: Organization
    definition:
    glossary: A group of people collaborating toward a common purpose by delivering products and services that meet the needs or desires of the customers they serve.
  organizational-driver:
    name: Organizational Driver
    definition: An **organizational driver** is a situation where the organization's members have a motive to respond because they anticipate that doing so is beneficial or necessary for fulfilling the organization’s purpose. (by helping generate value, eliminate waste, or avoid undesirable risks or consequences).
    glossary: A situation where the organization's members have a motive to respond because they anticipate that doing so is beneficial or necessary for fulfilling the organization’s purpose. (by helping generate value, eliminate waste, or avoid undesirable risks or consequences). Drivers are often expressed as _current conditions_ that lead to current or anticipated _effects_ that are _relevant_ to the organization.
  overall-domain:
    name: Overall Domain
    definition: The **overall domain** of an organization defines the organization's purpose, overall strategy, business model(s), and other standard constraints.
    glossary: The domain that defines the organization's purpose, overall strategy, business model(s), and other standard constraints.
  pattern:
    name: Pattern
    definition: A **pattern** is a process, practice, or guideline that serves as a template for successfully responding to a specific kind of challenge or opportunity.
    glossary: A process, practice or guideline that serves as a template for successfully responding to a specific kind of challenge or opportunity.
  policy:
    name: Policy
    definition: A **policy** is an intervention that is created and evolved through governance; a process, procedure, protocol, plan, strategy, or guideline.
    glossary: An intervention that is created and evolved through governance; a process, procedure, protocol, plan, strategy, or guideline.
  primary-driver:
    name: Primary Driver
    definition:
    glossary: The primary driver for a domain is the main driver that people who attend to that domain respond to.
  principle:
    name: Principle
    definition: A **principle** is a basic idea or rule that guides behavior, or explains or controls how something happens or works.
    glossary: A basic idea or rule that guides behavior, or explains or controls how something happens or works.
  purpose:
    definition: "**Purpose** is the reason why something is done, used, or created; a guiding motivation that directs actions, decisions, and resources toward achieving a valuable outcome."
    name: Purpose
    glossary:  The reason why something is done, used, or created; a guiding motivation that directs actions, decisions, and resources toward achieving a valuable outcome.
  requirement:
    name: Requirement
    definition: A **requirement** is a state considered valuable to establish or maintain in order to address a specific driver. 
    glossary: A state considered valuable to establish or maintain in order to address a specific driver. Requirements are often expressed as _intended outcome(s)_, and _enabling condition(s)_ considered necessary to establish for achieving or maintaining those outcomes.
  role:
    name: Role
    definition:
    glossary: A domain that is delegated to an individual, who then becomes the role keeper. 
  role-keeper:
    name: Role Keeper
    definition:
    glossary: An individual taking responsibility for a role.
  scm:
    name: Sociocratic Circle-Organisation Method (SCM)
    glossary: An egalitarian governance method for organizations based on a sociocratic mindset, developed in the Netherlands by Gerard Endenburg.
  self-governance:
    name: Self-Governance
    definition:
    glossary: People governing themselves within the constraints of a domain.
  self-organization:
    name: Self-Organization
    definition:
    glossary: Any activity or process through which people organize work. Self-organization happens within the constraints of a domain, but without the direct influence of  external agents. In any organization or team, self-organization co-exists with external influence (e.g. external objections or governance decisions that affect the domain).
  semi-autonomy:
    name: Semi-Autonomy
    definition:
    glossary: The autonomy of people to decide for themselves how to create value, limited by the constraints of their domain and by objections brought by the delegator, representatives, or others.
  social-technology:
    name: Social Technology
    definition: "**Social technology** is any process, technique, method, skill or any other approach that people can use to influence social systems – organizations, societies, communities, etc. – to support achieving shared objectives and guide meaningful interaction and exchange."
    glossary: Any process, technique, method, skill or any other approach that people can use to influence social systems – organizations, societies, communities, etc. – to support achieving shared objectives and guide meaningful interaction and exchange.
  sociocracy:
    name: Sociocracy
    glossary: An approach for organizing together where people affected by decisions can influence them on the basis of reasons to do so.
  standard-constraint:
    name: Standard Constraint
    definition: A **standard constraint** is a constraint that affects several domains (e.g., all sales teams, an entire branch, platform, or department) or even all domains of the organization (e.g., company-wide strategy, a business model, or an organization-wide rule).
    glossary: A constraint that affects several domains (e.g., all sales teams, an entire branch, platform, or department) or even all domains of the organization (e.g., company-wide strategy, a business model, or an organization-wide rule).
  strategy:
    name: Strategy
    definition: A **strategy** is a high-level approach for how people will fulfill the purpose of a domain (within the constraints of that domain).
    glossary: A high-level approach for how people will fulfill the purpose of a domain (within the constraints of that domain).
  subdomain:
    name: Subdomain
    definition:
    glossary: A domain that is fully contained within another domain.
  subdriver:
    name: Subdriver
    definition:
    glossary: A subdriver arises as a consequence of responding to another driver (the superdriver) and is essential for effectively responding to the superdriver.
  superdriver:
    name: Superdriver
    definition:
    glossary: see Subdriver.
  superdomain:
    name: Superdomain
    definition:
    glossary: A domain that fully contains another domain. 
  team:
    name: Team
    definition:
    glossary: A group of people collaborating toward fulfilling a shared purpose. Typically, a team is part of an organization, or it is formed as a collaboration of several organizations.
  tension:
    name: Tension
    definition:
    glossary: A personal experience, a symptom of dissonance between an individual's perception of a situation and their expectations or preferences.
  time-box:
    name: Time box
    definition: A **time box** is a fixed period of time spent focused on a specific activity (which is not necessarily finished by the end of the time box).
    glossary: A fixed period of time spent focused on a specific activity (which is not necessarily finished by the end of the time box).
  transparency:
    name: Transparency (principle)
    definition:
    glossary: "**Record all information that is valuable for the organization and make it accessible to everyone in the organization, unless there is a reason for confidentiality**, so that everyone has the information they need to understand how to do their work in a way that contributes most effectively to the whole."
  tuners:
    name: Tuners
    glossary: One or more people who use the information and ideas collected in Proposal Forming to design a coherent proposal (not a final decision).

  value:
    name: Value
    definition: "**Value** is the importance, worth or usefulness of something for fulfilling a purpose."
    glossary: 'The importance, worth, or usefulness of something for fulfilling a purpose. Also: "a valued principle that guides behavior" (mostly used as plural "values", e.g. "organizational values").'
  values:
    name: Values
    definition: '**Values** are valued principles that guide behavior. Values define scope for action and ethical constraints.'
    glossary: 'Valued principles that guide behavior. Not to be confused with "value" (singular) in the context of a driver.'
  waste:
    name: Waste
    definition: "**Waste**, in relation to purpose, is any activity, output, or use of resources that does not contribute — directly or indirectly — to fulfilling that purpose."
    glossary: Any activity, output, or use of resources that does not contribute — directly or indirectly — to fulfilling a specific purpose."
